<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кулинарная мастерская</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Кулинарная мастерская</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#slider">Галерея</a></li>
          <li class="nav-item"><a class="nav-link" href="#cards">Блюда</a></li>
          <li class="nav-item"><a class="nav-link" href="#faq">Вопросы</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <section id="slider" class="mb-5">
      <div id="photos" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/Borsch_served.jpg" class="d-block w-100" alt="Борщ" style="max-height:360px;object-fit:cover;">
          </div>
          <div class="carousel-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Blini_1.jpg" class="d-block w-100" alt="Блины" style="max-height:360px;object-fit:cover;">
          </div>
          <div class="carousel-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/8d/Pelmeni_russian.jpg" class="d-block w-100" alt="Пельмени" style="max-height:360px;object-fit:cover;">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#photos" data-bs-slide="prev">
          <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#photos" data-bs-slide="next">
          <span class="carousel-control-next-icon"></span>
        </button>
      </div>
    </section>

    <section id="cards" class="mb-5">
      <div class="row g-3">
        <div class="col-12 col-lg-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">Борщ</h5>
              <p class="card-text">Классический суп со свеклой.</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-lg-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">Блины</h5>
              <p class="card-text">Тонкие блины со сметаной.</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-lg-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">Пельмени</h5>
              <p class="card-text">Домашние пельмени с мясом.</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="faq" class="mb-5">
      <div class="accordion" id="faqAcc">
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#q1">Как заказать?</button>
          </h2>
          <div id="q1" class="accordion-collapse collapse show" data-bs-parent="#faqAcc">
            <div class="accordion-body">Напишите нам на почту или в Telegram.</div>
          </div>
        </div>
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#q2">Есть доставка?</button>
          </h2>
          <div id="q2" class="accordion-collapse collapse" data-bs-parent="#faqAcc">
            <div class="accordion-body">Да, по городу в тот же день.</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-dark text-white py-4">
    <div class="container">
      <p class="mb-1">Контакты: kitchen@example.com, +7 900 000-00-00</p>
      <p class="mb-0">
        <a class="link-light" href="https://t.me/">Telegram</a> ·
        <a class="link-light" href="https://vk.com/">VK</a>
      </p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
