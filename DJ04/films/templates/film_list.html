<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Фильмы</title>
</head>
<body>
    <h1>Список фильмов</h1>
    <p><a href="{% url 'add_film' %}">Добавить фильм</a></p>
    {% for film in films %}
        <article>
            <h2>{{ film.title }}</h2>
            <p><b>Описание:</b> {{ film.description }}</p>
            <p><b>Отзыв:</b> {{ film.review }}</p>
        </article>
        <hr>
    {% empty %}
        <p>Фильмов пока нет.</p>
    {% endfor %}
</body>
</html>
