<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Регистрация</title>
</head>
<body>
  <h1>Регистрация</h1>
  {% if error %}<p>{{ error }}</p>{% endif %}
  <form method="post">
    <p>Имя: <input type="text" name="username" required></p>
    <p>Пароль: <input type="password" name="password" required></p>
    <p>Повтор пароля: <input type="password" name="confirm" required></p>
    <button type="submit">Зарегистрироваться</button>
  </form>
  <p><a href="{{ url_for('login') }}">Уже есть аккаунт</a></p>
</body>
</html>
