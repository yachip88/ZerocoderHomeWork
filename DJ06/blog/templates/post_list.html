<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Блог</title>
</head>
<body>
    <h1>Посты блога</h1>
    {% for post in posts %}
        <article>
            <h2>{{ post.title }}</h2>
            <p>Автор: {{ post.author }}</p>
            <p>{{ post.text }}</p>
        </article>
    {% empty %}
        <p>Постов пока нет.</p>
    {% endfor %}
</body>
</html>
